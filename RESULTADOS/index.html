<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados de Fonética</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(#dbeafe,#f8fafc);color:#0f172a}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#0f766e);color:#fff;border-radius:24px;padding:24px;box-shadow:0 16px 38px #0f172a33}.hero h1{margin:0}.hero p{color:#dbeafe}.tools,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:13px;padding:10px 13px;font-weight:800;cursor:pointer;background:#334155;color:white}.tab{background:white;color:#334155;border:1px solid #dbe4ef}.tab.active{background:#7c3aed;color:#fff}.danger{background:#b91c1c}.card{background:#fff;border:1px solid #dbe4ef;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 10px 26px #0f172a14}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-weight:900}.meta{color:#64748b}.score{font-size:1.5rem;font-weight:1000;color:#0f766e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:14px}.section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px}.word-list{display:flex;gap:7px;flex-wrap:wrap}.word{background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:7px 10px;display:inline-flex;gap:6px;align-items:center}.speak{background:#e0f2fe;color:#075985;padding:5px 8px}.sentence{background:#fff;border-left:4px solid #60a5fa;padding:11px;border-radius:10px;margin:8px 0;line-height:1.5}.empty{text-align:center;padding:40px;color:#64748b}details summary{cursor:pointer;font-weight:900}@media(max-width:650px){.wrap{padding:10px}.hero{border-radius:18px}.tools>*{width:100%}}@media print{.hero,.tools,.tabs,.delete{display:none!important}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<h1>📊 Resultados de Fonética</h1>
<p>Mismo formato para vocales, diptongos, triptongos, consonantes y blends.</p>
<div class="tools">
<button onclick="history.back()">← Volver</button>
<button onclick="window.print()">🖨️ Imprimir o guardar en PDF</button>
<button class="danger" onclick="clearAll()">🗑️ Borrar historial</button>
</div>
</header>
<nav class="tabs" id="tabs"></nav>
<section id="records"></section>
</main>
<script>
const KEY='fonetica_resultados_uniformes_v1';
const categories=['Todos','Vocales','Diptongos','Triptongos','Consonantes','Blends'];
let active='Todos';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(text);m.lang='en-US';m.rate=.82;const vs=speechSynthesis.getVoices();m.voice=vs.find(v=>/^en[-_](US|GB)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(m)}
function getRecords(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function clearAll(){if(confirm('¿Borrar todos los resultados guardados en este navegador?')){localStorage.removeItem(KEY);render()}}
function del(id){localStorage.setItem(KEY,JSON.stringify(getRecords().filter(r=>r.id!==id)));render()}
function renderTabs(){document.getElementById('tabs').innerHTML=categories.map(c=>`<button class="tab ${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('')}
function render(){
 renderTabs();
 const list=getRecords().filter(r=>active==='Todos'||r.category===active);
 const box=document.getElementById('records');
 if(!list.length){box.innerHTML='<div class="card empty"><h2>No hay resultados guardados</h2><p>Completa una actividad y pulsa <strong>Guardar resultado</strong>.</p></div>';return}
 box.innerHTML=list.map(r=>{
  const d=new Date(r.date),s=r.stats||{},words=r.words||[],sv=r.sentenceVocabulary||[],sent=r.sentences||[];
  return `<article class="card">
   <div class="top"><div><span class="badge">${esc(r.category)}</span><h2>${esc(r.topic)}</h2><div class="meta">👤 ${esc(r.student)} · 📅 ${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>
   <div><div class="score">${s.score??0}/100</div><button class="delete danger" onclick="del('${esc(r.id)}')">Borrar</button></div></div>
   <div class="grid">
    <div class="section"><h3>1. Resumen</h3><p>${s.mazeDone?'✅':'⏳'} Laberinto ${s.mazeDone?'completado':'pendiente'}</p><p>${s.sentencesDone?'✅':'⏳'} Oraciones ${s.sentencesDone?'completadas':'pendientes'}</p><p>${esc(s.progress||'Progreso: —')}</p><p>${esc(s.mistakes||'Errores: —')}</p><p>${esc(s.sentenceProgress||'Palabras marcadas: —')}</p></div>
    <div class="section"><h3>2. Palabras principales (${words.length})</h3><div class="word-list">${words.map(w=>`<span class="word"><strong>${esc(w.word)}</strong><span>${esc(w.ipa||'')}</span><button class="speak" onclick='speak(${JSON.stringify(String(w.word))})'>🔊</button></span>`).join('')}</div></div>
   </div>
   <details class="section" open style="margin-top:12px"><summary>3. Vocabulario de las oraciones (${sv.length})</summary><div class="word-list" style="margin-top:12px">${sv.map(w=>`<span class="word">${esc(w)}<button class="speak" onclick='speak(${JSON.stringify(String(w))})'>🔊</button></span>`).join('')}</div></details>
   <details class="section" open style="margin-top:12px"><summary>4. Oraciones completas (${sent.length})</summary>${sent.map((x,i)=>`<div class="sentence"><strong>${i+1}.</strong> ${esc(x)} <button class="speak" onclick='speak(${JSON.stringify(String(x))})'>🔊 Escuchar</button></div>`).join('')}</details>
  </article>`
 }).join('')
}
render();
</script>
</body>
</html>
