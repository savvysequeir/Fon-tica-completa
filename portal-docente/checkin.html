<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Amina · Registrar asistencia</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf6ef;font-family:Segoe UI,Arial;color:#173323;padding:18px}
    .card{width:min(480px,100%);background:#fff;border:1px solid #9fc0a8;border-radius:18px;padding:28px;text-align:center;box-shadow:0 16px 45px #17332322}
    .logo{width:92px;height:92px;object-fit:contain}h1{font-size:23px}.icon{font-size:58px}.ok{color:#176a3a}.error{color:#b42318}.wait{color:#725b00}
    .time{font-size:20px;font-weight:800}.retry{border:0;border-radius:9px;padding:12px 18px;background:#176a3a;color:#fff;font-weight:800;cursor:pointer}
    input{width:100%;padding:13px;border:1px solid #9fc0a8;border-radius:9px;font-size:18px;text-align:center;margin:10px 0 15px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="documentos/logo_unijjar.jpeg" alt="UNIJJAR">
    <h1>Registro de asistencia</h1>
    <div id="result"><div class="icon">⏳</div><p>Conectando con Amina…</p></div>
  </main>
  <script type="module" src="firebase-qr.js"></script>
  <script>
    const result=document.getElementById("result");
    const params=new URLSearchParams(location.search);
    const sessionId=params.get("sid")||"";
    let card=params.get("card")||"";
    let sending=false;

    function form(message="Escribe tu carnet y pulsa Enviar asistencia."){
      result.innerHTML=`<div class="icon">📱</div><h2>Confirmar asistencia</h2><p>${message}</p><input id="studentCard" autocomplete="off" placeholder="Ejemplo: 26-00077" value="${card.replaceAll('"','&quot;')}"><button class="retry" id="sendButton">Enviar asistencia</button>`;
      document.getElementById("sendButton").onclick=checkin;
      document.getElementById("studentCard").addEventListener("keydown",event=>{if(event.key==="Enter")checkin()});
    }
    function error(message){
      result.innerHTML=`<div class="icon">⚠️</div><h2 class="error">No se registró la asistencia</h2><p>${message}</p><button class="retry" onclick="location.reload()">Intentar nuevamente</button>`;
    }
    async function checkin(){
      if(sending)return;
      card=document.getElementById("studentCard")?.value.trim()||card;
      if(!card)return form("Debes escribir tu número de carnet.");
      if(!sessionId)return error("Este enlace QR está incompleto. Escanea nuevamente el QR mostrado por el docente.");
      if(!window.AminaFirebaseQR)return error("No se pudo conectar con Firebase. Revisa Internet e inténtalo otra vez.");
      sending=true;
      result.innerHTML='<div class="icon">⏳</div><p>Registrando asistencia…</p>';
      try{
        await window.AminaFirebaseQR.studentCheckin(sessionId,card);
        const time=new Date().toLocaleTimeString("es-NI",{hour:"2-digit",minute:"2-digit"});
        result.innerHTML=`<div class="icon">❤️</div><h2 class="ok">Asistencia registrada</h2><p>Carnet: <b>${card}</b></p><p class="time">🕒 ${time}</p><p>El registro fue enviado al docente. Ya puedes cerrar esta página.</p>`;
      }catch(e){
        const text=String(e?.code||e?.message||e);
        if(/permission-denied/i.test(text))error("El carnet no pertenece a esta lista, la sesión venció o la asistencia ya fue registrada.");
        else error("No se pudo enviar el registro. Revisa tu conexión e inténtalo nuevamente.");
      }finally{sending=false}
    }
    function ready(){
      if(!sessionId)return error("Este enlace no contiene una sesión válida. Escanea el QR del docente.");
      form();
    }
    if(window.AminaFirebaseQR)ready();else window.addEventListener("amina-firebase-qr-ready",ready,{once:true});
    setTimeout(()=>{if(!window.AminaFirebaseQR)error("Firebase no respondió. Abre este enlace directamente en Chrome o Safari.")},10000);
  </script>
</body>
</html>
