<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English A1 | Examination</title><style>
:root{--navy:#10233c;--blue:#285eea;--pale:#eff4ff;--ink:#182a40;--muted:#67778c;--line:#dfe7f0}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}header{background:linear-gradient(120deg,#10233c,#1c3d6a);color:white;padding:30px max(24px,calc((100vw - 1100px)/2));}header .eyebrow{letter-spacing:2px;color:#bcd2ff;font-size:12px;font-weight:800}h1{font-size:clamp(26px,4vw,40px);margin:9px 0}header p{color:#d4e2f6;margin:0}.shell{max-width:1100px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:240px 1fr;gap:22px}.sidebar,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px #1734560c}.sidebar{padding:20px;align-self:start;position:sticky;top:16px}.panel{padding:clamp(20px,4vw,38px);min-height:450px}.small{color:var(--muted);font-size:13px}.step{display:flex;justify-content:space-between;align-items:center;padding:13px 10px;border-radius:9px;color:#5e6d7f;font-size:13px}.step.active{background:var(--pale);color:var(--blue);font-weight:750}.step.done{color:#14855b}.meter{height:9px;background:#e8edf6;border-radius:10px;overflow:hidden;margin:12px 0 20px}.fill{height:100%;background:var(--blue);width:0%;transition:width .2s}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 25px}.pill{background:#edf3ff;color:#2a4d86;border-radius:30px;padding:8px 13px;font-size:12px;font-weight:750}h2{font-size:25px;margin:0 0 8px}.lead{color:var(--muted);line-height:1.6}label.field{display:block;font-weight:700;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #cdd8e7;border-radius:9px;font-size:15px;background:white}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:9px;background:var(--blue);color:white;font-size:14px;font-weight:750;padding:13px 22px}button.secondary{background:#e9eef6;color:#254263}button:disabled{opacity:.45;cursor:not-allowed}.question{padding:23px 0;border-bottom:1px solid var(--line)}.question h3{font-size:16px;line-height:1.5;margin:0 0 15px}.option{display:flex;align-items:center;gap:12px;border:1px solid #dae3ef;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer;line-height:1.4}.option:hover{background:#f7faff}.option.selected{border-color:var(--blue);background:#eef3ff}.option input{width:auto;accent-color:var(--blue)}.result{font-size:55px;color:var(--blue);font-weight:850;margin:18px 0}.breakdown{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.notice{background:#f2f6fd;border-radius:10px;padding:16px;line-height:1.6;color:#49617f;margin:18px 0}.correct{color:#078050}.wrong{color:#b53c3c}.hidden{display:none!important}@media(max-width:750px){.shell{display:block}.sidebar{position:static;margin-bottom:16px}.steps{display:grid;grid-template-columns:repeat(2,1fr)}header{padding:26px 20px}.panel{min-height:0}}@media print{header,.sidebar,.actions,.no-print{display:none!important}.shell{display:block;margin:0;padding:0}.panel{box-shadow:none;border:0}body{background:white}}
</style></head><body><header><div class="eyebrow">ACADEMIC ASSESSMENT · ENGLISH A1</div><h1>Pronunciation & Grammar Examination</h1><p>12 vowel sounds · Verb to Be · Present Simple · Simple Past</p></header><main class="shell"><aside class="sidebar"><b>EXAM OVERVIEW</b><p class="small">50 questions · 100 points · 90 minutes</p><div class="meter"><div class="fill" id="progress"></div></div><div class="steps" id="steps"></div><hr style="border:0;border-top:1px solid #e4eaf2;margin:20px 0"><div class="small" id="time">Time: 90:00</div><p class="small" id="answered">0 of 50 answered</p></aside><section class="panel" id="content"></section></main><script>
const Q=[{"q": "Which word contains /iː/?", "a": ["Ship", "Sheep", "Shop", "Shape"], "c": 1, "s": 0}, {"q": "Which word contains /ɪ/?", "a": ["Seat", "Sit", "Set", "Sat"], "c": 1, "s": 0}, {"q": "Which word contains /e/?", "a": ["Bed", "Bad", "Bird", "Bud"], "c": 0, "s": 0}, {"q": "Which word contains /æ/?", "a": ["Cut", "Cot", "Cat", "Cart"], "c": 2, "s": 0}, {"q": "Which word contains /ɑː/ in British English?", "a": ["Cup", "Car", "Cap", "Cop"], "c": 1, "s": 0}, {"q": "Which word contains /ɒ/ in British English?", "a": ["Hot", "Hut", "Hat", "Heart"], "c": 0, "s": 0}, {"q": "Which word contains /ɔː/?", "a": ["Pull", "Pool", "Port", "Pot"], "c": 2, "s": 0}, {"q": "Which word contains /ʊ/?", "a": ["Food", "Foot", "Fool", "Feed"], "c": 1, "s": 0}, {"q": "Which word contains /uː/?", "a": ["Look", "Luck", "Luke", "Lock"], "c": 2, "s": 0}, {"q": "Which word contains /ʌ/?", "a": ["Cut", "Cat", "Cot", "Cart"], "c": 0, "s": 0}, {"q": "Which word contains /ɜː/?", "a": ["Bird", "Board", "Bed", "Bad"], "c": 0, "s": 0}, {"q": "Which word contains /ə/ in its first syllable?", "a": ["About", "Apple", "Able", "April"], "c": 0, "s": 0}, {"q": "Which word has a different vowel sound?", "a": ["See", "Tree", "Green", "Sit"], "c": 3, "s": 0}, {"q": "Which word has a different vowel sound?", "a": ["Book", "Look", "Food", "Good"], "c": 2, "s": 0}, {"q": "Which pair contains /æ/ and /ʌ/, respectively?", "a": ["Cat / Cut", "Cut / Cat", "Cot / Cart", "Seat / Sit"], "c": 0, "s": 0}, {"q": "She ___ a medical student.", "a": ["am", "are", "is", "be"], "c": 2, "s": 1}, {"q": "They ___ at school yesterday.", "a": ["are", "was", "were", "is"], "c": 2, "s": 1}, {"q": "I ___ very happy today.", "a": ["is", "am", "are", "was"], "c": 1, "s": 1}, {"q": "My father ___ at home last night.", "a": ["were", "are", "was", "is"], "c": 2, "s": 1}, {"q": "Choose the correct negative sentence.", "a": ["She not is a teacher.", "She isn’t a teacher.", "She don’t be a teacher.", "She aren’t a teacher."], "c": 1, "s": 1}, {"q": "___ your friends at the party last Saturday?", "a": ["Was", "Is", "Were", "Are"], "c": 2, "s": 1}, {"q": "Choose the correct question.", "a": ["Is he your brother?", "He is your brother?", "Does he is your brother?", "Are he your brother?"], "c": 0, "s": 1}, {"q": "We ___ tired after the exam yesterday.", "a": ["was", "were", "is", "am"], "c": 1, "s": 1}, {"q": "Was Maria absent yesterday?", "a": ["Yes, she is.", "Yes, she were.", "Yes, she was.", "Yes, she does."], "c": 2, "s": 1}, {"q": "My parents ___ doctors.", "a": ["am", "is", "are", "be"], "c": 2, "s": 1}, {"q": "My sister ___ English every day.", "a": ["study", "studies", "studied", "studying"], "c": 1, "s": 2}, {"q": "They ___ breakfast at seven o’clock.", "a": ["has", "having", "have", "had"], "c": 2, "s": 2}, {"q": "He ___ like coffee.", "a": ["don’t", "doesn’t", "isn’t", "not"], "c": 1, "s": 2}, {"q": "___ you work on Saturdays?", "a": ["Does", "Are", "Do", "Did"], "c": 2, "s": 2}, {"q": "Choose the correct sentence.", "a": ["She go to school.", "She goes to school.", "She going to school.", "She does goes to school."], "c": 1, "s": 2}, {"q": "How often ___ your mother cook?", "a": ["do", "is", "does", "did"], "c": 2, "s": 2}, {"q": "The students ___ in the library every afternoon.", "a": ["studies", "study", "studied", "studying"], "c": 1, "s": 2}, {"q": "Choose the correct negative sentence.", "a": ["He doesn’t plays soccer.", "He don’t play soccer.", "He doesn’t play soccer.", "He isn’t play soccer."], "c": 2, "s": 2}, {"q": "My brother always ___ his homework.", "a": ["finish", "finishes", "finished", "finishing"], "c": 1, "s": 2}, {"q": "___ Maria and Ana speak English?", "a": ["Does", "Do", "Is", "Are"], "c": 1, "s": 2}, {"q": "I ___ my grandmother yesterday.", "a": ["visit", "visits", "visited", "visiting"], "c": 2, "s": 3}, {"q": "She ___ to the hospital last Monday.", "a": ["go", "went", "goes", "going"], "c": 1, "s": 3}, {"q": "They ___ the movie last night.", "a": ["didn’t watch", "didn’t watched", "don’t watched", "weren’t watch"], "c": 0, "s": 3}, {"q": "___ you finish your homework yesterday?", "a": ["Do", "Does", "Did", "Were"], "c": 2, "s": 3}, {"q": "My father ___ a new car last year.", "a": ["buy", "buys", "buyed", "bought"], "c": 3, "s": 3}, {"q": "Choose the correct sentence.", "a": ["She didn’t went home.", "She didn’t go home.", "She doesn’t went home.", "She not went home."], "c": 1, "s": 3}, {"q": "We ___ dinner at eight last night.", "a": ["eat", "eats", "ate", "eating"], "c": 2, "s": 3}, {"q": "Where ___ you go last weekend?", "a": ["do", "does", "did", "were"], "c": 2, "s": 3}, {"q": "He ___ his keys yesterday morning.", "a": ["lose", "losed", "lost", "loses"], "c": 2, "s": 3}, {"q": "Choose the correct past form of teach.", "a": ["Teached", "Taught", "Teach", "Teaching"], "c": 1, "s": 3}, {"q": "Yesterday I ___ tired, but today I ___ fine.", "a": ["am / was", "was / am", "were / is", "is / am"], "c": 1, "s": 4}, {"q": "My brother usually ___ to work, but yesterday he ___ at home.", "a": ["walk / stay", "walks / stayed", "walked / stays", "walks / stay"], "c": 1, "s": 4}, {"q": "___ your teacher at school yesterday?", "a": ["Is", "Does", "Was", "Did"], "c": 2, "s": 4}, {"q": "Maria ___ English every day, but she ___ French last year.", "a": ["studies / studied", "study / study", "studied / studies", "studies / study"], "c": 0, "s": 4}, {"q": "Choose the grammatically correct sentence.", "a": ["He doesn’t worked yesterday.", "He didn’t work yesterday.", "He don’t works every day.", "He didn’t worked yesterday."], "c": 1, "s": 4}];const S=[["Pronunciation", 30], ["Verb to Be", 20], ["Present Simple", 20], ["Simple Past", 20], ["Integrated Grammar", 10]];let state={page:-1,answers:Array(Q.length).fill(null),name:'',id:'',career:'',date:new Date().toLocaleDateString('en-CA'),remaining:5400,submitted:false};let timer=null;const el=document.getElementById('content');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const answered=()=>state.answers.filter(x=>x!==null).length;const score=()=>Q.reduce((t,q,i)=>t+(state.answers[i]===q.c?2:0),0);function save(){try{sessionStorage.setItem('a1exam',JSON.stringify(state))}catch(e){}}function drawSidebar(){document.getElementById('progress').style.width=(answered()/Q.length*100)+'%';document.getElementById('answered').textContent=answered()+' of '+Q.length+' answered';document.getElementById('steps').innerHTML=S.map((s,i)=>'<div class="step '+(state.page===i?'active':state.page>i?'done':'')+'"><span>'+(i+1)+'. '+esc(s[0])+'</span><span>'+s[1]+' pts</span></div>').join('');let m=Math.floor(state.remaining/60),sec=state.remaining%60;document.getElementById('time').textContent='Time: '+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function render(){drawSidebar();if(state.page===-1){el.innerHTML='<h2>Student information</h2><p class="lead">Complete your information to begin the examination. You have 90 minutes once you start.</p><form id="intro"><label class="field">Full name</label><input id="name" required maxlength="120" value="'+esc(state.name)+'"><label class="field">Student ID</label><input id="id" required maxlength="60" value="'+esc(state.id)+'"><label class="field">Career / Group</label><input id="career" required maxlength="120" value="'+esc(state.career)+'"><label class="field">Date</label><input id="date" type="date" required value="'+esc(state.date)+'"><div class="notice">Select one answer per question. Each correct answer is worth 2 points. You can review your answers before submitting. The exam is automatically submitted when the timer reaches zero.</div><button type="submit">Start examination →</button></form>';document.getElementById('intro').onsubmit=e=>{e.preventDefault();state.name=document.getElementById('name').value.trim();state.id=document.getElementById('id').value.trim();state.career=document.getElementById('career').value.trim();state.date=document.getElementById('date').value;if(!state.name||!state.id||!state.career)return;state.page=0;save();startTimer();render()};return}if(state.submitted){renderResults();return}if(state.page===5){el.innerHTML='<h2>Review your answers</h2><p class="lead">'+answered()+' answered · '+(Q.length-answered())+' unanswered</p>'+S.map((s,i)=>'<div class="breakdown"><span>'+esc(s[0])+'</span><b>'+Q.filter((q,j)=>q.s===i&&state.answers[j]!==null).length+' / '+Q.filter(q=>q.s===i).length+'</b></div>').join('')+'<div class="notice">After submission, your answers will be graded and the answer key will be displayed.</div><div class="actions"><button class="secondary" onclick="navigate(4)">← Back</button><button onclick="submitExam()">Submit examination ✓</button></div>';return}let n=state.page;el.innerHTML='<div class="stats"><span class="pill">SECTION '+(n+1)+' OF 5</span><span class="pill">'+S[n][1]+' POINTS</span></div><h2>'+esc(S[n][0])+'</h2><p class="lead">Choose the best answer for each question.</p>'+Q.map((q,i)=>({...q,i})).filter(q=>q.s===n).map(q=>'<div class="question"><h3>'+(q.i+1)+'. '+esc(q.q)+'</h3>'+q.a.map((a,j)=>'<label class="option '+(state.answers[q.i]===j?'selected':'')+'"><input type="radio" name="q'+q.i+'" value="'+j+'" '+(state.answers[q.i]===j?'checked':'')+' onchange="choose('+q.i+','+j+')"><span>'+String.fromCharCode(65+j)+'. '+esc(a)+'</span></label>').join('')+'</div>').join('')+'<div class="actions"><button class="secondary" onclick="navigate('+(n-1)+')" '+(n===0?'disabled':'')+'>← Previous</button><button onclick="navigate('+(n+1)+')">'+(n===4?'Review answers':'Next section →')+'</button></div>'}function choose(i,j){state.answers[i]=j;save();document.querySelectorAll('input[name="q'+i+'"]').forEach(r=>r.closest('.option').classList.toggle('selected',Number(r.value)===j));drawSidebar()}function navigate(n){state.page=n;save();render();window.scrollTo(0,0)}function startTimer(){if(timer||state.submitted||state.page<0)return;timer=setInterval(()=>{state.remaining=Math.max(0,state.remaining-1);drawSidebar();if(state.remaining%5===0)save();if(state.remaining===0)submitExam(true)},1000)}function submitExam(force=false){if(!force&&answered()<Q.length&&!confirm('You have '+(Q.length-answered())+' unanswered questions. Submit anyway?'))return;state.submitted=true;state.page=6;clearInterval(timer);timer=null;save();render();window.scrollTo(0,0)}function renderResults(){let t=score(),level=t>=90?'Advanced':t>=70?'Satisfactory':t>=50?'Fundamental':'Initial';el.innerHTML='<h2>Examination results</h2><p class="lead">'+esc(state.name)+' · '+esc(state.id)+' · '+esc(state.career)+' · '+esc(state.date)+'</p><div class="result">'+t+' / 100</div><span class="pill">'+level+' Achievement</span><h3 style="margin-top:32px">Score by section</h3>'+S.map((s,i)=>'<div class="breakdown"><span>'+esc(s[0])+'</span><b>'+Q.reduce((v,q,j)=>v+(q.s===i&&state.answers[j]===q.c?2:0),0)+' / '+s[1]+'</b></div>').join('')+'<div class="actions no-print"><button onclick="window.print()">Print results</button><button class="secondary" onclick="downloadResults()">Download results (.txt)</button><button class="secondary" onclick="newExam()">New exam</button></div><h3>Answer review</h3>'+Q.map((q,i)=>'<div class="question"><h3>'+(i+1)+'. '+esc(q.q)+'</h3><div class="'+(state.answers[i]===q.c?'correct':'wrong')+'">Your answer: '+(state.answers[i]===null?'Unanswered':esc(q.a[state.answers[i]]))+'</div><div class="correct">Correct answer: '+esc(q.a[q.c])+'</div></div>').join('')}function downloadResults(){const body='ENGLISH A1 EXAMINATION\nStudent: '+state.name+'\nID: '+state.id+'\nCareer: '+state.career+'\nDate: '+state.date+'\nScore: '+score()+'/100\n\n'+Q.map((q,i)=>(i+1)+'. '+q.q+'\nStudent: '+(state.answers[i]===null?'Unanswered':q.a[state.answers[i]])+'\nCorrect: '+q.a[q.c]).join('\n\n');const blob=new Blob([body],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='English_A1_Result.txt';a.click();URL.revokeObjectURL(url)}function newExam(){if(!confirm('Start a new examination? This clears the current attempt on this browser.'))return;sessionStorage.removeItem('a1exam');location.reload()}try{let old=JSON.parse(sessionStorage.getItem('a1exam'));if(old&&Array.isArray(old.answers)&&old.answers.length===Q.length)state=old}catch(e){}render();startTimer();
</script></body></html>
